<div class="business-auth-page">
  <div class="business-auth-card">
    <!-- ==============================
         BRAND
    =============================== -->

    <div class="auth-brand">
      <div class="brand-icon">
        <img src="/images/otro-colima.jpg" alt="Tarjeta de la Mujer" />
      </div>
    </div>

    <!-- ==============================
         HEADER
    =============================== -->

    <div class="auth-header">
      <span class="section-label"> NEGOCIOS </span>

      <h1>Bienvenido</h1>

      <p>Ingresa a tu cuenta para administrar tu negocio y sus beneficios.</p>
    </div>

    <!-- ==============================
         ERROR
    =============================== -->

    <div *ngIf="errorMessage" class="error-message">
      <span class="error-icon"> ! </span>

      <span>
        {{ errorMessage }}
      </span>
    </div>

    <!-- ==============================
         FORM
    =============================== -->

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <!-- EMAIL -->

      <div class="form-group">
        <label for="identifier"> Correo electrónico </label>

        <input
          id="identifier"
          type="email"
          formControlName="identifier"
          autocomplete="email"
          placeholder="correo@negocio.com"
          [disabled]="loading"
        />

        <small
          *ngIf="identifier?.invalid && (identifier?.touched || submitted)"
          class="field-error"
        >
          <span *ngIf="identifier?.errors?.['required']">
            El correo electrónico es obligatorio.
          </span>

          <span *ngIf="identifier?.errors?.['minlength']">
            Ingresa un correo electrónico válido.
          </span>
        </small>
      </div>

      <!-- PASSWORD -->

      <div class="form-group">
        <label for="password"> Contraseña </label>

        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Tu contraseña"
          [disabled]="loading"
        />

        <small
          *ngIf="password?.invalid && (password?.touched || submitted)"
          class="field-error"
        >
          La contraseña es obligatoria.
        </small>
      </div>

      <!-- LOGIN -->

      <button
        type="submit"
        class="login-button"
        [disabled]="loading || loginForm.invalid"
      >
        <span *ngIf="!loading"> INICIAR SESIÓN </span>

        <span *ngIf="loading"> INGRESANDO... </span>
      </button>
    </form>

    <!-- ==============================
         REGISTER
    =============================== -->

    <div class="register-section">
      <p>¿Todavía no tienes una cuenta?</p>

      <button type="button" class="register-button" (click)="goToRegister()">
        REGISTRAR MI NEGOCIO
      </button>
    </div>

    <!-- ==============================
         WOMAN LOGIN
    =============================== -->

    <div class="back-section">
      <button type="button" (click)="goToWomanLogin()">
        ← Iniciar sesión como mujer
      </button>
    </div>
  </div>
</div>
