<section class="auth-page">
  <div class="auth-card">
    <!-- ========================================= -->
    <!-- HEADER -->
    <!-- ========================================= -->

    <div class="auth-header">
      <div class="auth-logo">
        <span class="brand-icon">
          <img src="/images/otro-colima.jpg" alt="Tarjeta de la Mujer" />
        </span>
      </div>

      <h1>Bienvenida</h1>

      <p>Ingresa a tu cuenta de Tarjeta de la Mujer</p>
    </div>

    <!-- ========================================= -->
    <!-- FORMULARIO -->
    <!-- ========================================= -->

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- ========================================= -->
      <!-- CORREO -->
      <!-- ========================================= -->

      <div class="form-group">
        <label for="identifier"> Usuario </label>

        <input
          id="identifier"
          type="text"
          formControlName="identifier"
          autocomplete="email"
        />

        <small
          class="form-error"
          *ngIf="identifier?.touched && identifier?.invalid"
        >
          Ingresa un usuario.
        </small>
      </div>

      <!-- ========================================= -->
      <!-- CONTRASEÑA -->
      <!-- ========================================= -->

      <div class="form-group">
        <label for="password"> Contraseña </label>

        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />

        <small
          class="form-error"
          *ngIf="password?.touched && password?.invalid"
        >
          La contraseña debe tener al menos 6 caracteres.
        </small>
      </div>

      <!-- ========================================= -->
      <!-- ERROR LOGIN -->
      <!-- ========================================= -->

      <div class="login-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- ========================================= -->
      <!-- BOTÓN -->
      <!-- ========================================= -->

      <button type="submit" class="auth-button" [disabled]="loading">
        <span *ngIf="!loading"> Iniciar sesión </span>

        <span *ngIf="loading"> Iniciando sesión... </span>
      </button>

      <!-- ========================================= -->
      <!-- REGISTRO -->
      <!-- ========================================= -->

      <div class="auth-register">
        <span> ¿Aún no tienes cuenta? </span>

        <a routerLink="/register"> Crear cuenta </a>
      </div>
    </form>
  </div>
</section>
