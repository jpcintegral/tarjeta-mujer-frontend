<div class="woman-layout">
  <!-- ========================================= -->
  <!-- HEADER -->
  <!-- ========================================= -->

  <header class="woman-header">
    <div class="header-container">
      <a routerLink="/mujer/dashboard" class="brand"> Tarjeta de la Mujer </a>

      <div class="user-section">
        <span class="welcome"> Hola, {{ user?.username }} </span>

        <button type="button" class="logout-button" (click)="logout()">
          Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================= -->
  <!-- NAVIGATION -->
  <!-- ========================================= -->

  <nav class="woman-nav">
    <div class="nav-container">
      <a
        routerLink="/mujer/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Inicio
      </a>

      <a routerLink="/mujer/profile" routerLinkActive="active"> Mi perfil </a>

      <a routerLink="/mujer/card" routerLinkActive="active"> Mi tarjeta </a>
    </div>
  </nav>

  <!-- ========================================= -->
  <!-- CONTENIDO -->
  <!-- ========================================= -->

  <main class="woman-content">
    <router-outlet></router-outlet>
  </main>
</div>
