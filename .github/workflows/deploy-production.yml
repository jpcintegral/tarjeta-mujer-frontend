name: Deploy Frontend Production

on:
  push:
    branches:
      - production_branch

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy frontend to production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 15m

          script: |
            set -e

            echo "======================================"
            echo " DEPLOY TARJETA MUJER - FRONTEND"
            echo "======================================"

            PROJECT="/var/www/proyectos/tarjeta-mujer/frontend/tarjeta-mujer-frontend"

            echo "Entrando al proyecto..."
            cd "$PROJECT"

            echo "Rama actual:"
            git branch --show-current

            echo "Actualizando código..."
            git fetch origin production_branch
            git reset --hard origin/production_branch

            echo "======================================"
            echo " INSTALANDO DEPENDENCIAS"
            echo "======================================"

            npm ci

            echo "======================================"
            echo " CONSTRUYENDO ANGULAR - PRODUCTION"
            echo "======================================"

            npm run build -- --configuration production

            echo "======================================"
            echo " VERIFICANDO BUILD"
            echo "======================================"

            BUILD_DIR="$PROJECT/dist/tarjeta-mujer-frontend/browser"

            if [ ! -f "$BUILD_DIR/index.html" ]; then
              echo "ERROR: No se encontró index.html en:"
              echo "$BUILD_DIR"
              exit 1
            fi

            echo "Build encontrado:"
            ls -lh "$BUILD_DIR/index.html"

            echo "Contenido del build:"
            ls -lah "$BUILD_DIR" | head -20

            echo "======================================"
            echo " VERIFICANDO FRONTEND"
            echo "======================================"

            FRONTEND_STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              https://redrr.devscolima.com)

            echo "Frontend HTTP Status: $FRONTEND_STATUS"

            if [ "$FRONTEND_STATUS" != "200" ]; then
              echo "ERROR: El frontend no responde correctamente."
              exit 1
            fi

            echo "Frontend responde correctamente."

            echo "======================================"
            echo " VERIFICANDO API STRAPI"
            echo "======================================"

            API_URL="https://redback.devscolima.com/api/public-services?page=1&pageSize=10&sort=createdAt"

            API_STATUS=$(curl -L -s -o /tmp/tarjeta-mujer-api-response.json -w "%{http_code}" \
              --max-time 15 \
              "$API_URL")

            echo "API HTTP Status: $API_STATUS"

            if [ "$API_STATUS" != "200" ]; then
              echo "ERROR: La API pública no responde correctamente."
              echo "Respuesta de la API:"
              cat /tmp/tarjeta-mujer-api-response.json
              exit 1
            fi

            echo "API pública responde correctamente."

            echo "Respuesta de la API:"
            head -c 500 /tmp/tarjeta-mujer-api-response.json
            echo

            echo "======================================"
            echo " DEPLOY COMPLETADO"
            echo "======================================"
